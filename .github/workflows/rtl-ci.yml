name: RTL Verification
on:
  push:
  pull_request:
jobs:
  alu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator and system Python
        run: sudo apt-get update && sudo apt-get install -y verilator make g++ python3-venv
      - name: Create Python environment
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint ALU
        run: make lint
      - name: Verify ALU
        run: make test
      - name: Validate measured functional coverage
        run: python3 verification/check_coverage.py
      - name: Generate and verify RTL execution trace
        run: make trace
      - name: Generate load/store RTL execution trace
        run: make trace-load-store
      - name: Validate load/store trace
        run: python3 verification/check_load_store_trace.py
      - name: Validate trace replay invariants
        run: python3 verification/check_trace.py
      - name: Validate trace schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("visualizer/public/trace.json")
          data = json.loads(p.read_text())
          assert data["schema_version"] == 1
          assert len(data["cycles"]) == 8
          assert data["cycles"][-1]["halted_after"]
          assert data["cycles"][6]["registers_after"][7] == 0x1018
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build visualization
        run: |
          cd visualizer
          npm install --no-audit --no-fund
          npm run build
      - name: Install browser for visualizer smoke test
        run: cd visualizer && npx playwright install --with-deps chromium
      - name: Run browser replay and capture screenshot
        run: cd visualizer && npm run test:browser
      - name: Upload real visualizer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvcore-visualizer-screenshot
          path: visualizer/artifacts/rvcore-load-store-visualizer.png
          if-no-files-found: ignore
