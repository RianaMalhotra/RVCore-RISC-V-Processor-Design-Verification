name: RTL Verification
on:
  push:
  pull_request:
jobs:
  alu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator and system Python
        run: sudo apt-get update && sudo apt-get install -y verilator make g++ python3-venv
      - name: Create Python environment
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint ALU
        run: make lint
      - name: Verify ALU
        run: make test
      - name: Generate and verify RTL execution trace
        run: make trace
      - name: Validate trace schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("visualizer/public/trace.json")
          data = json.loads(p.read_text())
          assert data["schema_version"] == 1
          assert len(data["cycles"]) == 8
          assert data["cycles"][-1]["halted_after"]
          assert data["cycles"][6]["registers_after"][7] == 0x1018
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build visualization
        run: |
          cd visualizer
          npm install --no-audit --no-fund
          npm run build
