<text x="767" y="133" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#243246" font-weight="600" text-anchor="start">✓ Passing</text>
<text x="40" y="179" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#344154" font-weight="400" text-anchor="start">Building a 32-bit RISC-V processor from verified SystemVerilog components.</text>
<text x="40" y="207" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#344154" font-weight="400" text-anchor="start">Implemented today: standalone ALU and register file. CPU integration is planned.</text>
<line x1="40" y1="229" x2="1010" y2="229" stroke="#e2e8f0" stroke-width="2"/>
<text x="40" y="274" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#17253b" font-weight="700" text-anchor="start">1. Project Overview</text>
<text x="40" y="311" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344154" font-weight="400" text-anchor="start">A modular digital hardware project developed entirely</text>
<text x="40" y="338" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344154" font-weight="400" text-anchor="start">in simulation. RTL is tested with cocotb and Verilator,</text>
<text x="40" y="365" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344154" font-weight="400" text-anchor="start">using directed and reproducible randomized tests.</text>
<text x="40" y="392" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344154" font-weight="400" text-anchor="start">GitHub Actions runs lint and regression on changes.</text>
<text x="40" y="419" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344154" font-weight="400" text-anchor="start"></text>
<text x="40" y="446" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344154" font-weight="400" text-anchor="start">Goal: build toward an RV32I processor, then explore</text>
<text x="40" y="473" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#344154" font-weight="400" text-anchor="start">design-for-test concepts such as scan and BIST.</text>
<rect x="552" y="293" width="457" height="239" rx="12" fill="#eef6ff" stroke="#d7e6fa"/>
