<text x="40" y="1086" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#17253b" font-weight="700" text-anchor="start">3. How It Works</text>
<rect x="40" y="1105" width="472" height="232" rx="12" fill="#edf7ff" stroke="#dceafa"/>
<rect x="527" y="1105" width="482" height="232" rx="12" fill="#f5efff" stroke="#e5d9f5"/>
<text x="60" y="1139" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#182d48" font-weight="700" text-anchor="start">ALU</text>
<text x="60" y="1171" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">Two 32-bit inputs and a 3-bit operation selector.</text>
<text x="60" y="1199" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">000 ADD    001 SUB    010 AND</text>
<text x="60" y="1227" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">011 OR       100 XOR</text>
<text x="60" y="1255" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">Result wraps to 32 bits; zero flag asserts</text>
<text x="60" y="1283" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">when the result equals zero.</text>
<text x="547" y="1139" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#182d48" font-weight="700" text-anchor="start">Register File</text>
<text x="547" y="1171" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">32 registers (x0–x31), each 32 bits wide.</text>
<text x="547" y="1199" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">Two asynchronous read ports.</text>
<text x="547" y="1227" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">One synchronous write port (rising edge).</text>
<text x="547" y="1255" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">Writes to x0 are ignored; reads return zero.</text>
<text x="547" y="1283" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#344154" font-weight="400" text-anchor="start">Reset clears storage (project design choice).</text>
