<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><rect width="1000" height="410" rx="18" fill="#f8fafc"/><text x="32" y="44" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Implemented RTL modules (independent, not yet connected)</text><rect x="35" y="80" width="445" height="275" rx="15" fill="#eaf5ff" stroke="#3976a5" stroke-width="2"/><text x="55" y="119" font-family="Arial" font-size="22" font-weight="bold" fill="#173b61">32-bit ALU</text><text x="55" y="162" font-family="Arial" font-size="19" fill="#173b61">Inputs: a[31:0], b[31:0], op[2:0]</text><text x="55" y="206" font-family="Arial" font-size="19" fill="#173b61">ADD · SUB · AND · OR · XOR</text><text x="55" y="250" font-family="Arial" font-size="19" fill="#173b61">Outputs: result[31:0], zero</text><text x="55" y="303" font-family="Arial" font-size="17" fill="#475569">Combinational logic; no clock</text><rect x="520" y="80" width="445" height="275" rx="15" fill="#eaf7ed" stroke="#378154" stroke-width="2"/><text x="540" y="119" font-family="Arial" font-size="22" font-weight="bold" fill="#205638">32 × 32-bit register file</text><text x="540" y="162" font-family="Arial" font-size="19" fill="#205638">Reads: rs1, rs2 → rd1, rd2</text><text x="540" y="206" font-family="Arial" font-size="19" fill="#205638">Write: we, rd, wd on rising clk</text><text x="540" y="250" font-family="Arial" font-size="19" fill="#205638">x0 hardwired to zero</text><text x="540" y="303" font-family="Arial" font-size="17" fill="#475569">Synchronous active-high reset</text><text x="500" y="389" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Future integration will connect register outputs to ALU operands and ALU results to writeback.</text></svg>