<text x="40" y="1051" class="heading">3. How It Works</text>
<rect x="40" y="1070" width="457" height="215" rx="12" fill="#edf7ff" stroke="#dbeafe"/>
<rect x="512" y="1070" width="472" height="215" rx="12" fill="#f5efff" stroke="#e8dafa"/>
<text x="59" y="1106" class="sub">ALU</text>
<g class="body">
<text x="59" y="1140">Takes two 32-bit operands and a 3-bit</text>
<text x="59" y="1167">operation code. Produces a 32-bit result.</text>
<text x="59" y="1208" class="mono">000 ADD   001 SUB   010 AND</text>
<text x="59" y="1238" class="mono">011 OR    100 XOR</text>
<text x="532" y="1140">32 registers (x0–x31), each 32 bits.</text>
<text x="532" y="1167">Two asynchronous read ports.</text>
<text x="532" y="1194">One rising-edge synchronous write port.</text>
<text x="532" y="1221">x0 always reads zero; writes ignored.</text>
<text x="532" y="1248">Synchronous reset clears storage.</text>
</g>
<text x="532" y="1106" class="sub">Register File</text>
<path d="M40 1307 H984" stroke="#e2e8f0"/>
<text x="40" y="1350" class="heading">4. Verification Strategy</text>
<rect x="40" y="1367" width="944" height="63" rx="11" fill="#f5f8fc" stroke="#e2e8f0"/>
