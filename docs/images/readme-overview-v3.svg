<text x="270" y="1406">Verilator</text><text x="378" y="1406">→</text>
<text x="416" y="1406">cocotb + Python</text><text x="587" y="1406">→</text>
<text x="628" y="1406">Assertions</text><text x="750" y="1406">→</text>
<text x="788" y="1406">GitHub CI</text>
</g><rect x="0" y="1430" width="1024" height="610" fill="#ffffff"/>
