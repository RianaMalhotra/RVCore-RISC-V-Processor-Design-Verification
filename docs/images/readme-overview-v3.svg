<text x="271" y="921" class="small" text-anchor="middle">2 reads · 1 write · x0 = 0</text>
<text x="57" y="865" class="mono">rs1/rs2 →</text><text x="57" y="903" class="mono">rd / wd →</text>
<text x="387" y="883" class="small">rd1/rd2</text>
