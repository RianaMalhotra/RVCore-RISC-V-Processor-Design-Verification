<text x="271" y="750" font-size="20" font-weight="700" text-anchor="middle">32-bit ALU</text>
<text x="271" y="778" class="small" text-anchor="middle">ADD · SUB · AND · OR · XOR</text>
<text x="57" y="747" class="mono">a[31:0] →</text><text x="57" y="780" class="mono">b[31:0] →</text>
