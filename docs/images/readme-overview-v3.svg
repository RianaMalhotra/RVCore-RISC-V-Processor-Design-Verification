<text x="40" y="56" font-size="38" font-weight="700">RISC-V SoC Verification</text>
<text x="40" y="90" font-size="20">SystemVerilog RTL design and Python-based hardware verification</text>
<g font-size="15" font-weight="600">
<rect x="40" y="111" width="133" height="32" rx="6" fill="#edf1f6"/><text x="51" y="133">SystemVerilog</text>
<rect x="183" y="111" width="84" height="32" rx="6" fill="#edf1f6"/><text x="195" y="133">Python</text>
<rect x="277" y="111" width="89" height="32" rx="6" fill="#edf1f6"/><text x="289" y="133">cocotb</text>
<rect x="376" y="111" width="101" height="32" rx="6" fill="#edf1f6"/><text x="388" y="133">Verilator</text>
<rect x="487" y="111" width="145" height="32" rx="6" fill="#edf1f6"/><text x="499" y="133">GitHub Actions</text>
<rect x="642" y="111" width="106" height="32" rx="6" fill="#edf1f6"/><text x="654" y="133">Ubuntu CI</text>
<rect x="758" y="111" width="96" height="32" rx="6" fill="#dcfce7"/><text x="770" y="133" fill="#166534">✓ Passing</text>
</g>
<text x="40" y="180" class="body">Building a 32-bit RISC-V processor incrementally from verified hardware blocks.</text>
<text x="40" y="207" class="body">Implemented: ALU, register file, decoder subset. CPU integration is planned.</text>
<path d="M40 230 H984" stroke="#e2e8f0"/>
<text x="40" y="276" class="heading">1. Project Overview</text>
<g class="body">
<text x="40" y="313">A simulation-only digital hardware project</text>
<text x="40" y="340">using SystemVerilog, Verilator, and cocotb.</text>
<text x="40" y="367">Each module is independently tested using</text>
<text x="40" y="394">directed and seeded randomized scenarios.</text>
<text x="40" y="435">Next: integrate an RV32I arithmetic-subset CPU</text>
<text x="40" y="462">and later explore DFT/DFX techniques.</text>
</g>
<rect x="530" y="292" width="454" height="235" rx="12" fill="#edf5ff" stroke="#dbeafe"/>
